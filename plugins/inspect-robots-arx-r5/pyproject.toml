[build-system]
requires = ["hatchling>=1.18", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "inspect-robots-arx-r5"
version = "0.1.0"
description = "ARX (方舟无限) R5 single- or dual-arm embodiment adapter for Inspect Robots, driven through the official ARX_R5_python SDK over CAN."
dynamic = ["readme"]
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Inspect Robots contributors" }]
keywords = ["robotics", "arx", "r5", "bimanual", "inspect_robots", "vla", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# The ARX SDK (`arx_r5_python` pybind module + the `bimanual` wrapper package) is
# NOT on PyPI: it is built from github.com/ARXroboticsX/R5 on the rig host and
# imported lazily from `sdk_path`. This package installs, registers, and is
# discoverable anywhere; only reset()/step() need the SDK and a CAN link.
dependencies = ["inspect-robots>=0.58", "numpy>=1.24"]

[project.optional-dependencies]
cameras = ["opencv-python-headless>=4.8"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "inspect-robots-agent",
]

[project.entry-points."inspect_robots.embodiments"]
arx_r5 = "inspect_robots_arx_r5:arx_r5_embodiment"

[project.scripts]
inspect-robots-arx-r5-check = "inspect_robots_arx_r5.check:main"

[project.urls]
Homepage = "https://github.com/zhikangSu/inspect-robots/tree/main/plugins/inspect-robots-arx-r5"
Repository = "https://github.com/zhikangSu/inspect-robots"
"ARX R5 SDK" = "https://github.com/ARXroboticsX/R5"

[tool.uv.sources]
inspect-robots = { workspace = true }
inspect-robots-agent = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_robots_arx_r5"]

[tool.hatch.build.targets.sdist]
include = ["src/inspect_robots_arx_r5", "tests", "README.md"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["inspect_robots", "inspect_robots_arx_r5"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]

[tool.mypy]
strict = true

# The ARX SDK and OpenCV ship no stubs and are imported lazily inside functions.
[[tool.mypy.overrides]]
module = ["bimanual.*", "arx_r5_python.*", "cv2.*"]
ignore_missing_imports = true

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?m)^> \[!NOTE\][ \t]*$'
replacement = '> **Note:**'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?m)^> \[!WARNING\][ \t]*$'
replacement = '> **Warning:**'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?m)^> \[!CAUTION\][ \t]*$'
replacement = '> **Caution:**'
