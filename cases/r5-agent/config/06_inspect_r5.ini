# inspect-robots 用户配置（INSPECT_ROBOTS_CONFIG 指向本文件，见 inspect_env.sh）。
# 数值来源：关节范围 = 70 条遥操作数据集 r5_block_into_plate_v2 的 qpos 范围外扩 0.15~0.2 rad，
# 再按 r5_kin.JOINT_LIMITS 截断；夹爪原始读数 闭合≈0 / 张开≈5（2026-09-19 用 --gripper 预检实测 0→4.9）；
# home 姿态 = 末端 (0.12,-0.08,0.17)、俯仰 0.9（腕部相机约垂直向下看工作区），指尖离桌 21 cm，
# 从折叠位线性插值过去全程指尖离桌 ≥16 cm（r5_kin FK 核过）。
[defaults]
policy = claude
embodiment = arx_r5

[embodiment.args]
arms = left
left_can = can1
arm_type = 0
control_hz = 20
joint_low = -1.1,-0.05,-0.05,-1.3,-0.7,-1.2
joint_high = 0.3,2.2,1.7,0.8,0.4,0.5
joint_max_step = 0.05
gripper_closed = 0.0
gripper_open = 5.0
gripper_max_step = 0.2
home_joints = -0.35,1.2,1.2,-0.9,0,0
home_gripper = 1.0
rest_joints = 0,0,0,0,0,0
rest_gripper = 0.0
ramp_secs = 6
cameras = fixed:/dev/video4,wrist:/dev/video10
cam_width = 640
cam_height = 480
park_before_grade = true
auto_start = true

[policy.args]
mailbox = ~/R5/logs/claude_driver
max_speed_frac = 0.02
